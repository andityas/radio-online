<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Radio Player Pro | Streaming Radio Indonesia Online Terlengkap</title>
    <meta name="description" content="Dengarkan streaming radio Indonesia favorit secara online dengan kualitas audio jernih dan update otomatis stasiun radio terlengkap.">
    <meta name="keywords" content="radio online, streaming radio indonesia, prambors, ardan fm, delta fm, radio player id">
    <meta name="theme-color" content="#1db954">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1db954;
            --primary-dark: #14833b;
            --primary-glow: rgba(29, 185, 84, 0.3);
            --dark: #0a0c0b;
            --card-bg: #181818;
            --card-hover: #1f1f1f;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
            --border: #282828;
            --radius-card: 18px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, var(--dark) 0%, #050706 100%);
            color: var(--text);
            margin: 0;
            padding-bottom: 170px;
            min-height: 100vh;
        }

        /* ========= HEADER RESPONSIF ========= */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, #0e9e44 100%);
            padding: 1.2rem 1rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom-left-radius: 1.5rem;
            border-bottom-right-radius: 1.5rem;
        }

        .tagline {
            font-size: clamp(0.65rem, 3vw, 0.75rem);
            font-weight: 600;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: clamp(1.3rem, 6vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0.5rem 0 0.2rem;
        }

        #radio-count {
            font-size: clamp(0.65rem, 3vw, 0.75rem);
            font-weight: 600;
            background: rgba(0,0,0,0.35);
            display: inline-block;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .search-container {
            margin: 0.8rem auto 0.5rem;
            max-width: 320px;
            padding: 0 0.5rem;
        }

        #search-input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #111;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        #search-input:focus {
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* TABS responsif */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.7rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3vw, 0.8rem);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            border-color: white;
        }

        /* ========= GRID RADIO : SANGAT RESPONSIF ========= */
        #radio-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Responsive grid breakpoints */
        @media (max-width: 480px) {
            #radio-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
                padding: 1rem;
            }
        }
        @media (min-width: 481px) and (max-width: 640px) {
            #radio-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
                padding: 1.2rem;
            }
        }
        @media (min-width: 641px) and (max-width: 900px) {
            #radio-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 901px) {
            #radio-list {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        /* CARD */
        .radio-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 0.8rem 0.6rem 0.7rem;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border);
            backdrop-filter: blur(2px);
        }

        .radio-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            background: var(--card-hover);
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.5);
        }

        .radio-card.playing {
            border: 2px solid var(--primary);
            background: linear-gradient(145deg, #1e2a1e, #121c12);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* LOGO : tetap proporsional */
        .radio-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #ffffff;
            border-radius: 14px;
            padding: 0.6rem;
            box-sizing: border-box;
        }

        .radio-card h3 {
            font-size: clamp(0.7rem, 3.5vw, 0.8rem);
            font-weight: 700;
            margin: 0.6rem 0 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* Tombol favorit */
        .fav-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            color: #ff6b6b;
            z-index: 12;
        }

        .fav-btn:hover {
            transform: scale(1.1);
        }

        /* ========= PLAYER RESPONSIF (TETAP DI BAWAH) ========= */
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 11, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(29, 185, 84, 0.4);
            padding: 0.8rem 1rem 1rem;
            z-index: 2000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }

        #now-playing {
            color: var(--primary);
            font-weight: 600;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            text-align: center;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #now-playing::-webkit-scrollbar {
            display: none;
        }

        audio {
            width: 100%;
            max-width: 500px;
            height: 42px;
            display: block;
            margin: 0 auto;
            border-radius: 30px;
        }

        /* Styling audio controls agar responsif */
        audio::-webkit-media-controls-panel {
            background-color: #1a1f1c;
        }
        audio::-webkit-media-controls-play-button {
            background-color: var(--primary);
            border-radius: 50%;
        }

        .signature {
            margin-top: 0.6rem;
            font-size: 0.65rem;
            text-align: center;
            color: #888;
        }

        .andit-name {
            color: var(--primary);
            font-weight: 700;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 1.5rem;
            backdrop-filter: blur(8px);
        }

        /* Loading */
        .loading-msg {
            grid-column: 1/-1;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>

<header>
    <div class="tagline">🎧 VIBING EVERYDAY NO CAP 🧢</div>
    <h1>🎵 RADIO PLAYER PRO</h1>
    <p id="radio-count">Menghubungkan frekuensi...</p>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Cari stasiun favorit..." onkeyup="filterRadios()" aria-label="Cari stasiun radio">
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">✨ All Vibes</button>
        <button class="tab-btn" id="tab-fav" onclick="switchTab('fav')">❤️ My Faves</button>
    </div>
</header>

<main>
    <div id="radio-list">
        <div class="loading-msg">🎵 Memuat daftar radio... tunggu sebentar ya!</div>
    </div>
</main>

<div class="player-container">
    <div id="now-playing" aria-live="polite">🎧 Pilih stasiun radio untuk mulai mendengarkan</div>
    <audio id="player" controls autoplay aria-label="Audio Player"></audio>
    <div class="signature">
        Manifested with ❤️ by <span class="andit-name">Andit</span> • Streaming Radio Indonesia
    </div>
</div>

<script>
    // ===================== DATA RADIO LENGKAP (25 STASIUN) =====================
    const RADIOS_DATA = [
        { "id": 1, "title": "Prambors FM", "logo": "https://cdn.onlineradiobox.com/img/l/7/18687.v44.png", "streamUrl": "https://stream.rcs.revma.com/h77wwp48kxcwv", "type": "audio/mpeg" },
        { "id": 2, "title": "Delta FM", "logo": "https://cdn.onlineradiobox.com/img/l/8/58058.v32.png", "streamUrl": "https://stream.rcs.revma.com/k02rmq48kxcwv", "type": "audio/mpeg" },
        { "id": 3, "title": "Radio Elshinta", "logo": "https://cdn.onlineradiobox.com/img/l/2/18812.v17.png", "streamUrl": "https://stream-ssl.arenastreaming.com:8000/jakarta", "type": "audio/mpeg" },
        { "id": 4, "title": "Gen FM", "logo": "https://cdn.onlineradiobox.com/img/l/6/19026.v38.png", "streamUrl": "https://wz.mari.co.id:1936/web_genfm/genfm/playlist.m3u8", "type": "application/x-mpegURL" },
        { "id": 5, "title": "Sonora FM Jakarta", "logo": "https://cdn.onlineradiobox.com/img/l/6/19176.v16.png", "streamUrl": "https://sonora-radio.arenastreaming.com/8130/stream", "type": "audio/mpeg" },
        { "id": 6, "title": "Suara Surabaya", "logo": "https://cdn.onlineradiobox.com/img/l/8/18988.v10.png", "streamUrl": "https://c5.siar.us/proxy/ssfm/stream", "type": "audio/mpeg" },
        { "id": 7, "title": "FeMale Radio", "logo": "https://cdn.onlineradiobox.com/img/l/6/60996.v19.png", "streamUrl": "https://stream.rcs.revma.com/9thenqqd2ncwv", "type": "audio/mpeg" },
        { "id": 8, "title": "Trax FM", "logo": "https://cdn.onlineradiobox.com/img/l/6/18806.v13.png", "streamUrl": "https://stream.radiojar.com/rrqf78p3bnzuv", "type": "audio/mpeg" },
        { "id": 9, "title": "Bahana FM", "logo": "https://cdn.onlineradiobox.com/img/l/8/19708.v25.png", "streamUrl": "https://s1.cloudmu.id/listen/bahana_fm/stream", "type": "audio/mpeg" },
        { "id": 10, "title": "Jak 101 FM", "logo": "https://cdn.onlineradiobox.com/img/l/5/19705.v45.png", "streamUrl": "https://wz.mari.co.id:1936/web_jakfm/jakfm/playlist.m3u8", "type": "application/x-mpegURL" },
        { "id": 11, "title": "OZ RADIO BANDUNG", "logo": "https://cdn.onlineradiobox.com/img/l/5/18985.v26.png", "streamUrl": "https://streaming.ozradio.id:8443/ozbandung", "type": "audio/mpeg" },
        { "id": 12, "title": "Ardan Radio", "logo": "https://cdn.onlineradiobox.com/img/l/7/18827.v12.png", "streamUrl": "https://stream.rcs.revma.com/ugpyzu9n5k3vv", "type": "audio/mpeg" },
        { "id": 13, "title": "iSwara FM", "logo": "https://cdn.onlineradiobox.com/img/l/9/18959.v12.png", "streamUrl": "https://stream.radiojar.com/4ywdgup3bnzuv", "type": "audio/mpeg" },
        { "id": 14, "title": "Slow Radio", "logo": "https://cdn.onlineradiobox.com/img/l/6/91316.v16.png", "streamUrl": "https://stream.zeno.fm/dpk2zq5np2zuv", "type": "audio/mpeg" },
        { "id": 15, "title": "The Rockin' Life", "logo": "https://cdn.onlineradiobox.com/img/l/0/18880.v17.png", "streamUrl": "https://stream.radiojar.com/7csmg90fuqruv", "type": "audio/mpeg" },
        { "id": 16, "title": "Golden Memories", "logo": "https://cdn.onlineradiobox.com/img/l/0/110170.v4.png", "streamUrl": "https://stream.zeno.fm/xg7mcgf1bf9uv", "type": "audio/mpeg" },
        { "id": 17, "title": "Dengerin Musik", "logo": "https://cdn.onlineradiobox.com/img/l/8/18908.v17.png", "streamUrl": "https://stream.denger.in/musik.mp3", "type": "audio/mpeg" },
        { "id": 18, "title": "Rock Rewind", "logo": "https://cdn.onlineradiobox.com/img/l/0/89300.v15.png", "streamUrl": "https://stream.zenolive.com/u18tuaphwzzuv.aac", "type": "audio/mpeg" },
        { "id": 19, "title": "Radio Imelda FM", "logo": "https://cdn.onlineradiobox.com/img/l/7/19177.v15.png", "streamUrl": "https://server.radioimeldafm.co.id:8030/imeldafm", "type": "audio/mpeg" },
        { "id": 20, "title": "Gajahmada FM", "logo": "https://cdn.onlineradiobox.com/img/l/6/19016.v10.png", "streamUrl": "https://server.radioimeldafm.co.id:8040/gajahmadafm", "type": "audio/mpeg" },
        { "id": 21, "title": "Big 90's", "logo": "https://cdn.onlineradiobox.com/img/l/6/92666.v8.png", "streamUrl": "https://stream.zeno.fm/qmqe8k5e74zuv", "type": "audio/mpeg" },
        { "id": 22, "title": "Mettaswara Dangdut", "logo": "https://cdn.onlineradiobox.com/img/l/9/124069.v7.png", "streamUrl": "https://mettaswara.com:8700/d4d", "type": "audio/mpeg" },
        { "id": 23, "title": "Rock Ballads", "logo": "https://cdn.onlineradiobox.com/img/l/4/110904.v2.png", "streamUrl": "https://stream.zeno.fm/ynepvmy14bhvv", "type": "audio/mpeg" },
        { "id": 24, "title": "NAGASWARA RADIOTEMEN Bogor", "logo": "https://cdn.onlineradiobox.com/img/l/2/19152.v27.png", "streamUrl": "https://live.nagaswarafm.com/nagaswararadio/stream", "type": "audio/mpeg" },
        { "id": 25, "title": "Kis Rock", "logo": "https://cdn.onlineradiobox.com/img/l/0/106040.v7.png", "streamUrl": "https://stream.zeno.fm/2nbxgbynb18uv", "type": "audio/mpeg" }
    ];

    // ===================== GLOBAL =====================
    let allRadios = RADIOS_DATA;
    let favorites = JSON.parse(localStorage.getItem('radioFavs')) || [];
    let currentTab = 'all';
    let currentHls = null;
    let currentPlayingId = null;

    // ===================== PLAY STREAM =====================
    window.playStream = function(url, type, title, id, logoUrl) {
        const audio = document.getElementById('player');
        if (!audio) return;

        document.title = "▶️ " + title + " | Radio Player Pro";
        const nowDiv = document.getElementById('now-playing');
        if (nowDiv) nowDiv.innerHTML = `🔥 Now Vibe-ing: <b>${title}</b>`;
        currentPlayingId = id;

        document.querySelectorAll('.radio-card').forEach(c => c.classList.remove('playing'));
        const activeCard = document.getElementById(`card-${id}`);
        if (activeCard) activeCard.classList.add('playing');

        if (currentHls) {
            try { currentHls.destroy(); } catch(e) {}
            currentHls = null;
        }

        audio.pause();
        audio.src = '';
        audio.load();

        const isHls = (type === 'application/x-mpegURL') || url.includes('.m3u8');
        if (isHls && Hls.isSupported()) {
            currentHls = new Hls({ enableWorker: true, fragLoadingTimeOut: 30000 });
            currentHls.loadSource(url);
            currentHls.attachMedia(audio);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                audio.play().catch(e => console.log("Autoplay perlu interaksi"));
            });
            currentHls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    if (nowDiv) nowDiv.innerHTML = `⚠️ Gagal memutar ${title}, coba stasiun lain.`;
                    if (currentHls) currentHls.destroy();
                    currentHls = null;
                }
            });
        } else {
            audio.src = url;
            audio.load();
            audio.play().catch(e => {
                if (nowDiv) nowDiv.innerHTML = `🎵 ${title} - klik play untuk mulai`;
            });
        }
    };

    window.toggleFav = function(e, id) {
        e.stopPropagation();
        const tid = Number(id);
        if (favorites.includes(tid)) {
            favorites = favorites.filter(f => f !== tid);
        } else {
            favorites.push(tid);
        }
        localStorage.setItem('radioFavs', JSON.stringify(favorites));
        renderRadios();
    };

    function renderRadios() {
        const container = document.getElementById('radio-list');
        const counter = document.getElementById('radio-count');
        const keyword = document.getElementById('search-input').value.toLowerCase().trim();

        let filtered = allRadios.filter(r => {
            const matchTab = (currentTab === 'all') || (currentTab === 'fav' && favorites.includes(r.id));
            const matchSearch = r.title.toLowerCase().includes(keyword);
            return matchTab && matchSearch;
        });

        if (counter) {
            if (keyword) counter.innerText = `🎙️ Ditemukan ${filtered.length} stasiun untuk "${keyword}"`;
            else counter.innerText = `📻 Streaming ${filtered.length} Stasiun Radio Indonesia`;
        }

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><h4>🎧 Stasiun tidak ditemukan</h4><p>Coba kata kunci lain atau tambahkan favorit dengan ❤️</p></div>`;
            return;
        }

        container.innerHTML = '';
        filtered.forEach(radio => {
            const isFav = favorites.includes(radio.id);
            const card = document.createElement('div');
            card.className = `radio-card ${currentPlayingId === radio.id ? 'playing' : ''}`;
            card.id = `card-${radio.id}`;
            const escapedUrl = radio.streamUrl.replace(/'/g, "\\'");
            const escapedTitle = radio.title.replace(/'/g, "\\'");
            card.innerHTML = `
                <button class="fav-btn" onclick="toggleFav(event, ${radio.id})">${isFav ? '❤️' : '🤍'}</button>
                <div onclick="playStream('${escapedUrl}', '${radio.type}', '${escapedTitle}', ${radio.id}, '${radio.logo}')">
                    <img src="${radio.logo}" alt="${radio.title}" loading="lazy" onerror="this.src='https://placehold.co/400x400?text=Radio'">
                    <h3>${radio.title}</h3>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('tab-all').classList.toggle('active', tab === 'all');
        document.getElementById('tab-fav').classList.toggle('active', tab === 'fav');
        renderRadios();
    };

    window.filterRadios = () => renderRadios();

    renderRadios();

    window.addEventListener('beforeunload', () => {
        if (currentHls) currentHls.destroy();
    });
</script>
</body>
</html>
