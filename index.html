    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* custom glass & animation */
        body {
            background: radial-gradient(circle at 10% 20%, rgba(15, 15, 35, 1) 0%, rgba(5, 5, 20, 1) 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(20, 20, 40, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            background: rgba(30, 30, 55, 0.7);
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.3);
        }
        .player-bar {
            background: rgba(12, 12, 24, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
        }
        .animate-pulse-slow {
            animation: pulseSlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulseSlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .radio-img {
            transition: transform 0.2s ease;
        }
        .group:hover .radio-img {
            transform: scale(1.05);
        }
        /* volume slider custom (tailwind accent tidak cukup) */
        input[type=range] {
            -webkit-appearance: none;
            background: #334155;
            height: 4px;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #8b5cf6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px #a78bfa;
        }
    </style>
</head>

        // Helper render grid
        function renderGrid() {
            let filtered = stations.filter(s => {
                if (currentTab === 'fav' && !favorites.includes(s.id)) return false;
                if (searchQuery.trim() !== '') {
                    return s.title.toLowerCase().includes(searchQuery.toLowerCase());
                }
                return true;
            });
            // sort favorit di atas
            filtered.sort((a,b) => {
                let aFav = favorites.includes(a.id), bFav = favorites.includes(b.id);
                if (aFav === bFav) return a.title.localeCompare(b.title);
                return aFav ? -1 : 1;
            });

            favCounterSpan.innerText = favorites.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400"><i class="fa-regular fa-circle-xmark text-2xl mb-2 block"></i>Tidak ada stasiun</div>`;
                return;
            }

            grid.innerHTML = filtered.map(sta => {
                const isFav = favorites.includes(sta.id);
                const isPlaying = currentStation && currentStation.id === sta.id && !audio.paused;
                return `
                    <div class="station-card glass-card rounded-2xl p-3 group cursor-pointer relative transition-all duration-200" data-id="${sta.id}">
                        <button class="fav-btn absolute top-2 right-2 z-10 w-7 h-7 rounded-full bg-black/30 backdrop-blur flex items-center justify-center text-sm hover:bg-black/50 transition ${isFav ? 'text-pink-400' : 'text-white/60'}" data-id="${sta.id}">
                            <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                        </button>
                        <div class="flex flex-col items-center text-center">
                            <div class="w-20 h-20 rounded-2xl bg-white/5 p-2 mb-3 overflow-hidden transition-all group-hover:shadow-indigo-500/20 shadow-lg">
                                <img src="${sta.logo}" class="w-full h-full object-contain radio-img" alt="${sta.title}" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Radio'">
                            </div>
                            <h3 class="font-medium text-sm line-clamp-2">${sta.title}</h3>
                            ${isPlaying ? '<span class="text-[10px] text-indigo-400 mt-1 flex items-center gap-1"><i class="fa-solid fa-waveform"></i> Playing</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // attach event listeners to cards and fav buttons
            document.querySelectorAll('.station-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-btn')) return;
                    const id = parseInt(card.dataset.id);
                    const station = stations.find(s => s.id === id);
                    if (station) playStation(station);
                });
            });
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    toggleFavorite(id);
                });
            });
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('radio_favs', JSON.stringify(favorites));
            renderGrid();
        }

        // Stop & reset HLS
        function stopPlayback() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            audio.pause();
            audio.src = '';
            audio.load();
            currentStation = null;
            playerBar.classList.add('translate-y-full');
            statusText.innerText = 'Stopped';
            statusText.classList.remove('text-emerald-300');
            statusText.classList.add('text-slate-400');
            playPauseIcon.className = "fa-solid fa-play ml-0.5";
            renderGrid();
        }

        function showError(msg) {
            statusText.innerText = msg || 'Gagal memutar';
            statusText.classList.add('text-red-300');
            statusText.classList.remove('text-emerald-300');
            playPauseIcon.className = "fa-solid fa-play ml-0.5";
            renderGrid();
        }

        async function playStation(station) {
            if (currentStation && currentStation.id === station.id && !audio.paused) return;
            
            // clean previous
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            audio.pause();
            audio.src = '';
            audio.load();

            currentStation = station;
            playerBar.classList.remove('translate-y-full');
            currentTitleSpan.innerText = station.title;
            currentLogoImg.src = station.logo;
            statusText.innerText = 'Connecting...';
            statusText.classList.remove('text-red-300', 'text-slate-400');
            statusText.classList.add('text-emerald-300');
            playPauseIcon.className = "fa-solid fa-pause";

            const isHls = station.streamUrl.includes('.m3u8');
            try {
                if (isHls && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(station.streamUrl);
                    hlsInstance.attachMedia(audio);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        audio.play().catch(e => showError('Stream error'));
                    });
                    hlsInstance.on(Hls.Events.ERROR, (_, data) => {
                        if (data.fatal) showError('HLS error');
                    });
                } else {
                    audio.src = station.streamUrl;
                    await audio.play();
                }
                renderGrid();
            } catch (err) {
                showError('Cannot play');
                console.warn(err);
            }
        }

        // audio event listeners
        audio.addEventListener('playing', () => {
            statusText.innerText = 'LIVE';
            statusText.classList.add('text-emerald-300');
            playPauseIcon.className = "fa-solid fa-pause";
            renderGrid();
        });
        audio.addEventListener('pause', () => {
            if (currentStation && audio.src) {
                statusText.innerText = 'Paused';
                statusText.classList.remove('text-emerald-300');
                playPauseIcon.className = "fa-solid fa-play ml-0.5";
                renderGrid();
            }
        });
        audio.addEventListener('error', () => showError('Stream error'));

        // UI controls
        playPauseBtn.addEventListener('click', () => {
            if (!currentStation) return;
            if (audio.paused) {
                audio.play().catch(() => showError('Cannot resume'));
            } else {
                audio.pause();
            }
        });
        stopBtn.addEventListener('click', stopPlayback);
        volumeSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            audio.volume = val;
            if (val === 0) volumeIcon.className = "fa-solid fa-volume-xmark";
            else if (val < 0.4) volumeIcon.className = "fa-solid fa-volume-low";
            else volumeIcon.className = "fa-solid fa-volume-high";
        });
        
        // Search + Tabs
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });
        tabAll.addEventListener('click', () => {
            currentTab = 'all';
            tabAll.className = "tab-btn px-5 py-1.5 rounded-full text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-md";
            tabFav.className = "tab-btn px-5 py-1.5 rounded-full text-sm font-medium transition-all duration-200 text-slate-300 hover:text-white";
            renderGrid();
        });
        tabFav.addEventListener('click', () => {
            currentTab = 'fav';
            tabFav.className = "tab-btn px-5 py-1.5 rounded-full text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-md";
            tabAll.className = "tab-btn px-5 py-1.5 rounded-full text-sm font-medium transition-all duration-200 text-slate-300 hover:text-white";
            renderGrid();
        });

        // init volume
        audio.volume = volumeSlider.value;
        renderGrid();

        // optional: restore last station if any
        const last = localStorage.getItem('lastStation');
        if (last) {
            try {
                const ls = JSON.parse(last);
                const lastStation = stations.find(s => s.id === ls.id);
                if (lastStation) playStation(lastStation);
            } catch(e) {}
        }
        window.addEventListener('beforeunload', () => {
            if (currentStation) localStorage.setItem('lastStation', JSON.stringify({id: currentStation.id}));
            if (hlsInstance) hlsInstance.destroy();
        });
    </script>
</body>
</html>
