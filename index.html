<head>

    <!-- HLS.js -->

</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white animate-pulse">
                <i class="fa-solid fa-radio text-xl"></i>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Nusantara Radio Player</h1>
        </div>
        <div class="relative w-full sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
            <input type="text" id="searchBar" placeholder="Cari stasiun radio..." class="w-full bg-slate-900 border border-slate-700 rounded-full py-2 pl-10 pr-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
    </header>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div class="flex gap-2 mb-6">
            <button id="tabAll" class="px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition-colors cursor-pointer">Semua Stasiun</button>
            <button id="tabFav" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer">Favorit <span id="favCount" class="ml-1 px-1.5 py-0.5 text-xs bg-slate-900 rounded-full">0</span></button>
        </div>
        <div id="radioGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <footer id="playerBar" class="bg-slate-800 border-t border-slate-700 sticky bottom-0 left-0 right-0 p-4 shadow-xl hidden z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 w-full sm:w-1/3">
                <img id="currentLogo" src="" alt="Logo" class="w-14 h-14 object-contain bg-white rounded-lg p-1 border border-slate-600">
                <div class="overflow-hidden">
                    <h3 id="currentTitle" class="font-semibold text-slate-100 truncate">Nama Radio</h3>
                    <p id="playerStatus" class="text-xs text-indigo-400 font-medium flex items-center gap-1">
                        <span class="flex h-2 w-2 relative" id="liveDot">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        Menghubungkan...
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button id="btnPlayPause" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-lg shadow-lg cursor-pointer transition-transform transform active:scale-95">
                    <i class="fa-solid fa-play ml-0.5" id="playIcon"></i>
                </button>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-1/3 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400" id="volumeIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="w-24 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

            {"id":50,"title":"Free FM","logo":"https://cdn.onlineradiobox.com/img/l/5/81395.v9.png","streamUrl":"https://rocafmadrid.radioca.st/stream"},
            {"id":51,"title":"Hits Radio Kandangan","logo":"https://cdn.onlineradiobox.com/img/l/6/149756.v3.png","streamUrl":"http://45.64.97.82:8030/stream"},
            {"id":52,"title":"KISI","logo":"https://cdn.onlineradiobox.com/img/l/0/19460.v11.png","streamUrl":"https://live.kisifm.com/listen/kisifm/;"}
        ];

        // ------------------------------
        // SISTEM FAVORIT & PEMUTAR
        // ------------------------------
        let favorites = JSON.parse(localStorage.getItem('radio_favs')) || [];
        let currentStation = null;
        let currentTab = 'all';
        let hlsInstance = null;

        const audio = document.getElementById('audioElement');
        const grid = document.getElementById('radioGrid');
        const searchBar = document.getElementById('searchBar');
        const playerBar = document.getElementById('playerBar');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIcon = document.getElementById('playIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const playerStatus = document.getElementById('playerStatus');
        const liveDot = document.getElementById('liveDot');

        // Render kartu radio
        function renderRadio(filterText = '') {
            grid.innerHTML = '';
            let filtered = radioData.filter(r => r.title.toLowerCase().includes(filterText.toLowerCase()));
            if (currentTab === 'fav') filtered = filtered.filter(r => favorites.includes(r.id));

            document.getElementById('favCount').innerText = favorites.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">Stasiun tidak ditemukan...</div>`;
                return;
            }

            filtered.forEach(radio => {
                const isFav = favorites.includes(radio.id);
                const isPlaying = currentStation && currentStation.id === radio.id && !audio.paused;
                const card = document.createElement('div');
                card.className = `bg-slate-800 border ${isPlaying ? 'border-indigo-500 shadow-md shadow-indigo-500/10' : 'border-slate-700'} rounded-xl p-4 flex flex-col items-center justify-between text-center relative hover:border-slate-500 transition-all group`;
                card.innerHTML = `
                    <button class="fav-btn absolute top-3 right-3 text-sm cursor-pointer transition-colors ${isFav ? 'text-rose-500' : 'text-slate-500 group-hover:text-slate-300'}" data-id="${radio.id}">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                    </button>
                    <div class="w-20 h-20 bg-white rounded-lg p-1.5 flex items-center justify-center mb-3 border border-slate-700 relative">
                        <img src="${radio.logo}" alt="${radio.title}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Radio'">
                        <button class="play-card-btn absolute inset-0 bg-slate-900/60 rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer text-white text-xl" data-id="${radio.id}">
                            <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>
                        </button>
                    </div>
                    <h4 class="font-medium text-sm text-slate-200 truncate w-full px-1">${radio.title}</h4>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', toggleFavorite));
            document.querySelectorAll('.play-card-btn').forEach(btn => btn.addEventListener('click', handleCardPlay));
        }

        // Main radio
        function playRadio(station) {
            if (currentStation && currentStation.id === station.id && !audio.paused) {
                audio.pause();
                updateUIPlayState(false);
                return;
            }

            // Hentikan HLS sebelumnya
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            currentStation = station;
            playerBar.classList.remove('hidden');
            document.getElementById('currentLogo').src = station.logo;
            document.getElementById('currentTitle').innerText = station.title;
            playerStatus.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Menghubungkan...';
            liveDot.classList.add('hidden');

            const url = station.streamUrl;
            // Deteksi HLS (.m3u8)
            if (url.includes('.m3u8') || url.includes('m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(audio);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(showPlayError));
                    hlsInstance.on(Hls.Events.ERROR, (_, data) => {
                        if (data.fatal) console.warn("HLS error", data);
                        showPlayError();
                    });
                } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                    audio.src = url;
                    audio.play().catch(showPlayError);
                } else {
                    showPlayError();
                }
            } else {
                audio.src = url;
                audio.play().catch(showPlayError);
            }
            updateUIPlayState(true);
        }

        function showPlayError() {
            playerStatus.innerText = "⚠️ Gagal memutar streaming ini.";
            updateUIPlayState(false);
        }

        function updateUIPlayState(isPlaying) {
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
            } else {
                playIcon.className = "fa-solid fa-play ml-0.5";
            }
            renderRadio(searchBar.value);
        }

        // Event handlers
        function handleCardPlay(e) {
            const id = parseInt(e.currentTarget.getAttribute('data-id'));
            const station = radioData.find(r => r.id === id);
            if (!station) return;
            if (currentStation && currentStation.id === id && !audio.paused) {
                audio.pause();
                updateUIPlayState(false);
            } else {
                playRadio(station);
            }
        }

        function toggleFavorite(e) {
            e.stopPropagation();
            const id = parseInt(e.currentTarget.getAttribute('data-id'));
            if (favorites.includes(id)) {
                favorites = favorites.filter(fid => fid !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('radio_favs', JSON.stringify(favorites));
            renderRadio(searchBar.value);
        }

        // Audio events
        audio.addEventListener('playing', () => {
            liveDot.classList.remove('hidden');
            playerStatus.innerText = " LIVE / STREAMING";
        });
        audio.addEventListener('pause', () => {
            liveDot.classList.add('hidden');
            playerStatus.innerText = " DIHENTIKAN";
            updateUIPlayState(false);
        });
        audio.addEventListener('error', () => showPlayError());

        btnPlayPause.addEventListener('click', () => {
            if (!currentStation) return;
            if (audio.paused) audio.play().catch(showPlayError);
            else audio.pause();
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            audio.volume = vol;
            const volIcon = document.getElementById('volumeIcon');
            if (vol === 0) volIcon.className = "fa-solid fa-volume-xmark text-slate-500";
            else if (vol < 0.4) volIcon.className = "fa-solid fa-volume-low text-slate-400";
            else volIcon.className = "fa-solid fa-volume-high text-slate-400";
        });

        // Tab & Search
        searchBar.addEventListener('input', (e) => renderRadio(e.target.value));
        document.getElementById('tabAll').addEventListener('click', () => {
            currentTab = 'all';
            document.getElementById('tabAll').className = "px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition-colors cursor-pointer";
            document.getElementById('tabFav').className = "px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer";
            renderRadio(searchBar.value);
        });
        document.getElementById('tabFav').addEventListener('click', () => {
            currentTab = 'fav';
            document.getElementById('tabFav').className = "px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition-colors cursor-pointer";
            document.getElementById('tabAll').className = "px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer";
            renderRadio(searchBar.value);
        });

        audio.volume = volumeSlider.value;
        renderRadio();
    </script>
</body>
</html>
