<!DOCTYPE html>
<html lang="id">
<head>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Radio Player Pro",
      "url": "https://andityas.github.io/radio-online/",

</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="logo-area">
                <i class="fa-solid fa-tower-broadcast logo-icon"></i>
                <h1 class="brand-title">Radio Player Pro</h1>
            </div>
            
            <nav class="search-nav" aria-label="Pencarian Radio">
                <div class="search-box">

                </div>
            </nav>
        </div>
    </header>

    <main class="main-layout">
        
        <section class="tab-section" aria-label="Navigasi Kategori">
            <div class="tabs-wrapper">
                <button id="tab-all" class="tab-btn active">Semua Stasiun</button>
                <button id="tab-fav" class="tab-btn">Favorit Saya</button>

        </section>

            <p>Temukan kemudahan mendengarkan stasiun radio terfavorit secara live 24 jam tanpa interupsi buffer.</p>
        </section>

        <section id="radio-list-container" aria-label="Daftar Stasiun Radio">
            <div id="radio-list">
                <div class="loading-msg">Sabar ya kak, lagi jemput data... ⏳</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="player-container">
            <div class="player-meta-block">
                <div class="avatar-mini-wrapper">
                    <img id="player-current-logo" src="https://via.placeholder.com/150?text=Radio" alt="Logo Pemutar Aktif">
                </div>
                <div id="now-playing" aria-live="polite">Lagi sepi nih, dengerin sesuatu yuk... 🎧</div>
            </div>
            
            <div class="player-controls-block">
                <audio id="player" controls aria-label="Audio Player"></audio>

            <div class="player-signature-block">
                <div class="signature">
                    Manifested with ❤️ by <span class=\"andit-name\">Andit</span>
