<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Radio Player Pro | Streaming Radio Indonesia Online</title>
    <meta name="description" content="Dengarkan streaming radio Indonesia favorit seperti Prambors, Ardan, dan Delta FM secara online dengan kualitas audio jernih.">
    <meta name="keywords" content="radio online, streaming radio indonesia, prambors, ardan fm, delta fm, radio player">
    <meta name="author" content="Andit">

    <meta property="og:title" content="Radio Player Pro - Streaming Radio Indonesia">
    <meta property="og:description" content="Vibing Everyday No Cap! Dengerin radio hits Indonesia di mana aja.">
    <meta property="og:type" content="website">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <span class="tagline">Vibing Everyday No Cap 🧢</span>
        <h1>🎵 RADIO PLAYER PRO</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari stasiun yang lagi hype..." onkeyup="filterRadios()" aria-label="Cari radio">
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">All Vibes</button>
            <button class="tab-btn" id="tab-fav" onclick="switchTab('fav')">My Faves ❤️</button>
        </div>
    </header>

    <main>
        <div style="display:none">
            <p>Aplikasi streaming radio Indonesia terbaik untuk mendengarkan musik favorit secara online gratis.</p>
        </div>

        <div id="radio-list">
            <div class="loading-msg">Sabar ya kak, lagi jemput data... ⏳</div>
        </div>
    </main>

    <div class="player-container">
        <div id="now-playing">Lagi sepi nih, dengerin sesuatu yuk... 🎧</div>
        <audio id="player" controls autoplay aria-label="Audio Player"></audio>
        <div class="signature">
            Manifested with ❤️ by <span class="andit-name">Andit</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
