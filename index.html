<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara Streaming - Radio Player</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- CSS eksternal (opsional, jika ingin dipisah) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white animate-pulse">
                <i class="fa-solid fa-radio text-xl"></i>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Nusantara Radio Player</h1>
        </div>
        <div class="relative w-full sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
            <input type="text" id="searchBar" placeholder="Cari stasiun radio..." class="w-full bg-slate-900 border border-slate-700 rounded-full py-2 pl-10 pr-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
    </header>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div class="flex gap-2 mb-6">
            <button id="tabAll" class="px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white">Semua Stasiun</button>
            <button id="tabFav" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Favorit <span id="favCount" class="ml-1 px-1.5 py-0.5 text-xs bg-slate-900 rounded-full">0</span></button>
        </div>
        <div id="radioGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <footer id="playerBar" class="bg-slate-800 border-t border-slate-700 sticky bottom-0 left-0 right-0 p-4 shadow-xl hidden z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 w-full sm:w-1/3">
                <img id="currentLogo" src="" alt="Logo" class="w-14 h-14 object-contain bg-white rounded-lg p-1 border border-slate-600">
                <div>
                    <h3 id="currentTitle" class="font-semibold text-slate-100 truncate">Nama Radio</h3>
                    <p id="playerStatus" class="text-xs text-indigo-400 font-medium flex items-center gap-1">
                        <span class="flex h-2 w-2 relative" id="liveDot">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        Menghubungkan...
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button id="btnPlayPause" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-lg shadow-lg transition-transform active:scale-95">
                    <i class="fa-solid fa-play ml-0.5" id="playIcon"></i>
                </button>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-1/3 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400" id="volumeIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="w-24 h-1 bg-slate-700 rounded-lg accent-indigo-500">
            </div>
        </div>
    </footer>

    <audio id="audioElement"></audio>

    <!-- JavaScript utama -->
    <script src="script.js"></script>
</body>
</html>
